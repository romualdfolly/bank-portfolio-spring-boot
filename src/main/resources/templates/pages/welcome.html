
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Accueil | Bank Portfolio</title>
</head>

<body>
<main>

    <!-- Grande bannière -->
    <section class="relative min-h-[530px] bg-cover bg-center"
    th:style="|background-image: url('@{/assets/images/bank-bg.png}');|">

        <div class="max-w-7xl mx-auto px-6 md:px-10
                    pt-44 md:pt-48">

            <div class="max-w-xl">

                <h1 class="text-4xl md:text-6xl
                           font-bold tracking-tight
                           leading-tight text-blue-950">
                    Une banque pour<br>
                    vos ambitions
                </h1>

                <p class="mt-5 text-lg md:text-xl
                          text-slate-700 leading-relaxed">
                    Gérez vos clients, comptes et transactions
                    en toute simplicité.
                </p>

            </div>

        </div>
    </section>

    <!-- Bloc principal superposé à la bannière -->
    <section class="relative -mt-16 z-10 px-6">

        <div class="max-w-7xl mx-auto bg-white
                    rounded-2xl shadow-xl
                    p-6 md:p-9">

            <!-- Contenu -->
            <div class="border-2 border-dashed border-blue-100
                        rounded-xl bg-slate-50/80
                        min-h-[230px]
                        flex flex-col items-center justify-center
                        text-center gap-5">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                    <!-- Clients -->
                    <div class="bg-white p-5 rounded-md shadow-sm">
                        <p class="text-sm text-slate-500">Clients</p>
                        <h2 class="text-3xl font-bold text-blue-950"
                            th:text="${nbClients}">0</h2>
                    </div>

                    <!-- Comptes -->
                    <div class="bg-white p-5 rounded-md shadow-sm">
                        <p class="text-sm text-slate-500">Comptes bancaires</p>
                        <h2 class="text-3xl font-bold text-blue-950"
                            th:text="${nbComptes}">0</h2>
                    </div>

                    <!-- Transactions -->
                    <div class="bg-white p-5 rounded-md shadow-sm">
                        <p class="text-sm text-slate-500">Transactions</p>
                        <h2 class="text-3xl font-bold text-blue-950"
                            th:text="${nbTransactions}">0</h2>
                    </div>

                </div>

                <p class="text-slate-500 text-sm font-mono">
                    Votre espace bancaire
                </p>

                <div class="flex flex-wrap justify-center gap-4">

                    <a th:href="@{/clients}"
                       class="bg-blue-950 hover:bg-blue-900
                              text-white font-medium px-6 py-3
                              rounded-lg transition">
                        Voir ou créer les clients
                    </a>

                </div>

            </div>

        </div>

    </section>

    <div class="h-16"></div>

</main>
</body>
</html>
